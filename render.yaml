# STONKZ API — Render Blueprint (Step A: indexer worker only)
# Validate: render blueprints validate render.yaml

databases:
  - name: stonkz-api-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: worker
    name: stonkz-api-indexer
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CHAIN_ID
        value: "4663"
      - key: RPC_URL
        value: https://rpc.mainnet.chain.robinhood.com
      - key: DATABASE_URL
        fromDatabase:
          name: stonkz-api-db
          property: connectionString
      - key: CONFIRMATION_BUFFER
        value: "5"
      - key: POLL_INTERVAL_MS
        value: "2000"
      - key: LOG_LEVEL
        value: info
